display_information:
  name: sr-bot
features:
  bot_user:
    display_name: sr-bot
    always_online: true
  slash_commands:
    - command: /bot
      description: Run a bot module (try /bot help)
      usage_hint: specs 9C4BPM4
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
