display_information:
  name: sr-bot
features:
  bot_user:
    display_name: sr-bot
    always_online: true
  slash_commands:
    - command: /bot
      description: Run a bot module (try /bot help)
      usage_hint: specs 9C4BPM4
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
      - files:read          # read CSV files dropped in a DM (the Dell export)
      - chat:write.public   # post the tidy result to a channel without being invited first
      - channels:manage     # `intake`: create a channel per device and set its topic
      - channels:write.invites  # `intake`: add people to that channel
      - users:read          # `intake`: turn @handles in INTAKE_INVITE into user IDs
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
